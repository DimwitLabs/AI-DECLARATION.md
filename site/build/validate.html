  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<nav>
  <a class="nav-mark" href="/">
    <span class="hex">䷼</span> AI-DECLARATION.md
  </a>
  <div class="nav-right">
    <a id="nav-back" class="nav-back" href="/" hidden></a>
    <a href="https://github.com/DimwitLabs/AI-DECLARATION.md">GitHub</a>
    <a class="nav-directory" href="/directory/">Directory</a>
    <a href="/validate/" class="nav-current nav-validate">Validate</a>
    <a class="nav-api" href="/api/">API</a>
  </div>
</nav>

<div class="subnav">
  <a href="/directory/">Directory</a>
  <a href="/validate/" class="subnav-current">Validate</a>
  <a href="/api/">API</a>
</div>

<div class="wrap">

  <section class="doc-section" id="validate">
    <h2>Validate</h2>
    <p>Paste your <code>AI-DECLARATION.md</code> content below to check it against the specification.</p>
    <textarea id="validate-input" class="validate-textarea" rows="14" spellcheck="false" placeholder="---&#10;version: &quot;0.1.2&quot;&#10;level: copilot&#10;---&#10;&#10;## Notes&#10;&#10;- ..."></textarea>
    <div class="validate-actions">
      <button id="validate-btn" class="validate-btn">Validate</button>
    </div>
  </section>

  <section class="doc-section" id="validate-results" hidden>
    <div id="result-summary"></div>
    <div id="result-list"></div>
  </section>

</div>

<footer>
  <div class="footer-inner">
    <p><span>䷼ AI-DECLARATION.md &nbsp;·&nbsp; MIT License</span><span class="footer-sep"> &nbsp;·&nbsp; </span><span class="footer-item"><a href="https://dimwit.me">Dimwit Labs</a></span><span class="footer-sep"> &nbsp;·&nbsp; </span><span class="footer-item"><a href="https://github.com/DimwitLabs/AI-DECLARATION.md">GitHub</a></span><span class="footer-sep"> &nbsp;·&nbsp; </span><span class="footer-item"><a href="/terms/">Terms</a></span><span class="footer-sep"> &nbsp;·&nbsp; </span><span class="footer-item"><a href="/privacy/">Privacy</a></span></p>
  </div>
</footer>

<script>
  async function validate(text) {
    const res = await fetch('https://api.ai-declaration.md/api/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: text,
    });
    const data = await res.json();
    return { errors: data.errors, warnings: data.warnings, notes: data.notes };
  }

  function esc(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function makeItem(cls, label, msg) {
    const el = document.createElement('div');
    el.className = 'result-item result-' + cls;
    el.innerHTML = '<span class="result-label">' + label + '</span><span class="result-msg">' + esc(msg) + '</span>';
    return el;
  }

  const last = localStorage.getItem('aidecl_last');
  if (last) {
    document.querySelector('.nav-mark').href = last;
    const parts = last.replace(/^\/|\/$/g, '').split('/');
    const back = document.getElementById('nav-back');
    back.href = last;
    back.textContent = parts[0].toUpperCase() + ' · v' + parts[1];
    back.hidden = false;
  }

  document.getElementById('validate-btn').addEventListener('click', async () => {
    const text = document.getElementById('validate-input').value;
    const resultsEl = document.getElementById('validate-results');
    const summaryEl = document.getElementById('result-summary');
    const listEl = document.getElementById('result-list');

    if (!text.trim()) {
      resultsEl.hidden = true;
      return;
    }

    let errors, warnings, notes;
    try {
      ({ errors, warnings, notes } = await validate(text));
    } catch (e) {
      resultsEl.hidden = false;
      summaryEl.innerHTML = '<div class="validate-summary validate-fail">Could not reach the validation API. Try again in a moment.</div>';
      listEl.innerHTML = '';
      return;
    }
    listEl.innerHTML = '';
    resultsEl.hidden = false;

    const ok = errors.length === 0 && warnings.length === 0;
    const notesSuffix = notes.length ? ` · ${notes.length} note${notes.length !== 1 ? 's' : ''}` : '';
    summaryEl.innerHTML = ok
      ? `<div class="validate-summary validate-ok">Valid${notesSuffix}</div>`
      : `<div class="validate-summary validate-fail">${errors.length} error${errors.length !== 1 ? 's' : ''} · ${warnings.length} warning${warnings.length !== 1 ? 's' : ''}${notesSuffix}</div>`;

    for (const msg of errors) listEl.appendChild(makeItem('error', 'ERROR', msg));
    for (const msg of warnings) listEl.appendChild(makeItem('warning', 'WARNING', msg));
    for (const msg of notes) listEl.appendChild(makeItem('note', 'NOTE', msg));

    resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
</script>

</body>
</html>
